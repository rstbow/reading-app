<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trent's Reading Adventure</title>
<style>
  :root {
    --green:#388E3C; --green-dark:#1B5E20; --green-light:#E8F5E9;
    --gold:#F9A825; --red:#C62828; --muted:#6B7280; --bg:#F1F8E9;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:#1A1A1A; min-height:100vh; overflow-x:hidden; }
  .screen { display:none; min-height:100vh; }
  .screen.active { display:flex; flex-direction:column; }

  /* HOME */
  #home { background:linear-gradient(160deg,#1B5E20 0%,#2E7D32 55%,#43A047 100%); align-items:center; justify-content:center; padding:40px 24px; text-align:center; position:relative; overflow:hidden; }
  .home-icon { font-size:90px; margin-bottom:12px; animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  .home-title { font-size:38px; font-weight:900; color:white; line-height:1.15; margin-bottom:6px; text-shadow:0 4px 12px rgba(0,0,0,0.3); }
  .home-sub { font-size:17px; color:rgba(255,255,255,0.85); margin-bottom:32px; font-weight:700; }
  .home-card { background:rgba(255,255,255,0.13); border-radius:20px; padding:22px; width:100%; max-width:360px; border:2px solid rgba(255,255,255,0.22); margin-bottom:22px; }
  .name-label { color:rgba(255,255,255,0.9); font-size:15px; font-weight:800; margin-bottom:10px; display:block; text-align:left; }
  .name-input { width:100%; padding:14px 18px; border-radius:14px; border:2px solid rgba(255,255,255,0.35); background:rgba(255,255,255,0.18); color:white; font-family:inherit; font-size:20px; font-weight:800; outline:none; text-align:center; }
  .name-input::placeholder { color:rgba(255,255,255,0.45); }
  .name-input:focus { border-color:var(--gold); }
  .start-btn { background:var(--gold); color:#1A1A1A; border:none; border-radius:16px; padding:18px 44px; font-family:inherit; font-size:24px; font-weight:900; cursor:pointer; box-shadow:0 6px 24px rgba(249,168,37,0.45); transition:transform 0.15s; }
  .start-btn:active { transform:scale(0.96); }
  .menu-link { display:inline-block; margin-top:24px; color:rgba(255,255,255,0.85); font-size:15px; font-weight:800; text-decoration:none; padding:10px 18px; border-radius:12px; border:2px solid rgba(255,255,255,0.3); }
  .home-btn { background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.3); color:white; border-radius:12px; width:44px; height:44px; font-size:20px; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* MAP */
  #map { background:var(--bg); }
  .map-header { background:linear-gradient(135deg,#1B5E20,#388E3C); padding:20px 20px 16px; color:white; box-shadow:0 4px 16px rgba(27,94,32,0.3); }
  .map-header-top { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .map-avatar { font-size:36px; }
  .map-hd { flex:1; }
  .map-hd h2 { font-size:20px; font-weight:900; }
  .map-hd p { font-size:13px; opacity:0.85; font-weight:600; }
  .prog-wrap { background:rgba(255,255,255,0.25); border-radius:20px; height:10px; overflow:hidden; }
  .prog-fill { height:100%; background:var(--gold); border-radius:20px; transition:width 0.6s ease; }
  .map-scroll { flex:1; overflow-y:auto; padding:20px 18px 40px; }
  .map-title { font-size:20px; font-weight:900; color:var(--green-dark); margin-bottom:16px; text-align:center; }
  .day-card { display:flex; align-items:center; gap:14px; background:white; border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 3px 12px rgba(0,0,0,0.07); cursor:pointer; border:3px solid transparent; transition:transform 0.15s,border-color 0.2s; position:relative; }
  .day-card:active { transform:scale(0.98); }
  .day-card.locked { opacity:0.4; cursor:not-allowed; }
  .day-card.done { border-color:var(--green); }
  .day-card.done::after { content:'✓'; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:24px; color:var(--green); font-weight:900; }
  .day-card.current { border-color:var(--gold); box-shadow:0 4px 18px rgba(249,168,37,0.28); }
  .day-num { width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; color:white; flex-shrink:0; }
  .day-info h3 { font-size:17px; font-weight:800; margin-bottom:2px; }
  .day-info p { font-size:12px; color:var(--muted); font-weight:600; }
  .day-emoji { font-size:26px; margin-left:auto; margin-right:32px; }

  /* STORY */
  #story { background:white; }
  .story-hdr { padding:16px 18px; display:flex; align-items:center; gap:12px; border-bottom:2px solid #F0F4F8; position:sticky; top:0; background:white; z-index:10; }
  .back-btn { width:42px; height:42px; border-radius:12px; border:none; background:#F0F4F8; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .back-btn:active { background:#E2E8F0; }
  .shdr-info { flex:1; }
  .s-day-tag { font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  .s-title { font-size:19px; font-weight:900; line-height:1.2; }
  .s-emoji { font-size:34px; }
  .story-body { padding:22px 22px 48px; flex:1; }

  .kw-box { border-radius:14px; padding:12px 16px; margin-bottom:14px; border-left:5px solid #388E3C; }
  .kw-lbl { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .kw-list { display:flex; flex-wrap:wrap; gap:8px; }
  .kw-chip { padding:6px 14px; border-radius:20px; font-size:16px; font-weight:800; color:white; }

  .tap-tip { background:#E8F5E9; border-radius:12px; padding:10px 14px; margin-bottom:22px; font-size:14px; font-weight:700; color:var(--green-dark); text-align:center; }

  .s-line { font-size:22px; font-weight:600; line-height:2; margin-bottom:4px; padding:2px 6px; border-radius:6px; }
  .word { cursor:pointer; border-radius:4px; padding:0 1px; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .word:active { background:rgba(56,142,60,0.20); }
  .s-line .hl { background:rgba(249,168,37,0.38); border-radius:4px; padding:0 3px; font-weight:900; }

  /* SOUND-ALIKE WORDS (Book 6) */
  .s-line .sa { border-bottom:4px solid #1976D2; background:rgba(25,118,210,0.12); border-radius:4px 4px 0 0; padding:0 3px; font-weight:900; }
  .s-line .hl.sa { background:rgba(249,168,37,0.38); }
  .sa-tip { background:#E3F2FD; border-radius:12px; padding:10px 14px; margin:-12px 0 22px; font-size:14px; font-weight:700; color:#0D47A1; text-align:center; }
  .sa-hd { font-size:24px; font-weight:900; margin-bottom:6px; }
  .sa-intro { font-size:19px; font-weight:700; line-height:1.5; margin-bottom:18px; }
  .sa-word { border:3px solid #BBDEFB; background:#F5FAFF; border-radius:18px; padding:16px 18px; margin-bottom:14px; }
  .sa-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .sa-big { font-size:44px; font-weight:900; color:#1565C0; word-break:break-word; }
  .sa-spk { background:var(--green); color:white; border:none; border-radius:14px; padding:12px 18px; font-family:inherit; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 4px 12px rgba(56,142,60,0.35); flex-shrink:0; }
  .sa-spk:active { transform:scale(0.96); }
  .sa-means { font-size:21px; font-weight:800; line-height:1.5; margin-bottom:4px; }
  .sa-ex { font-size:19px; font-weight:600; color:#374151; line-height:1.6; }
  .ww-count { font-size:13px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .ww-q { font-size:24px; font-weight:800; line-height:1.5; margin-bottom:14px; }
  .ww-opts { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .ww-btn { padding:20px 18px; border-radius:16px; border:3px solid #BBDEFB; background:white; font-family:inherit; font-size:30px; font-weight:900; color:#1565C0; cursor:pointer; text-align:center; transition:all 0.15s; }
  .ww-btn:active { transform:scale(0.98); }
  .ww-btn.correct { background:#E8F5E9; border-color:var(--green); color:var(--green-dark); }
  .ww-btn.wrong { background:#FFEBEE; border-color:var(--red); color:var(--red); cursor:default; }
  .ww-done { font-size:22px; font-weight:900; color:var(--green-dark); background:#E8F5E9; border-radius:14px; padding:16px; text-align:center; }

  /* WORD POPUP */
  .wpop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:500; padding:24px; }
  .wpop.show { display:flex; }
  .wpop-card { background:white; border-radius:24px; padding:32px 28px 22px; text-align:center; max-width:340px; width:100%; box-shadow:0 14px 44px rgba(0,0,0,0.35); }
  .wpop-word { font-size:42px; font-weight:900; color:#1A1A1A; margin-bottom:14px; word-break:break-word; }
  .wpop-syl { font-size:30px; font-weight:800; color:var(--green); letter-spacing:1px; margin-bottom:6px; }
  .wpop-say { font-size:24px; font-weight:800; color:#E65100; margin-bottom:22px; }
  .wpop-mean { display:none; font-size:20px; font-weight:800; color:#0D47A1; background:#E3F2FD; border-radius:12px; padding:10px 14px; margin-bottom:20px; }
  .wpop-spk { background:var(--green); color:white; border:none; border-radius:16px; padding:16px 32px; font-family:inherit; font-size:22px; font-weight:900; cursor:pointer; box-shadow:0 5px 16px rgba(56,142,60,0.4); }
  .wpop-spk:active { transform:scale(0.96); }
  .wpop-close { margin-top:16px; font-size:13px; color:#9CA3AF; font-weight:700; }

  .sec { margin-top:26px; padding-top:22px; border-top:2px solid #F0F4F8; }
  .sec-title { font-size:21px; font-weight:900; margin-bottom:4px; }
  .sec-sub { font-size:14px; color:var(--muted); font-weight:600; margin-bottom:16px; }
  .quiz-q { font-size:18px; font-weight:800; margin-bottom:12px; }
  .quiz-opts { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .qopt { padding:15px 18px; border-radius:13px; border:3px solid #E2E8F0; background:white; font-family:inherit; font-size:17px; font-weight:700; cursor:pointer; text-align:left; transition:all 0.15s; }
  .qopt:active { transform:scale(0.98); }
  .qopt.correct { background:#E8F5E9; border-color:var(--green); color:var(--green-dark); }
  .qopt.wrong { background:#FFEBEE; border-color:var(--red); color:var(--red); }
  .qopt.disabled { cursor:default; }
  .quiz-fb { font-size:17px; font-weight:800; min-height:24px; margin-bottom:12px; }
  .quiz-fb.good { color:var(--green); }
  .quiz-fb.bad { color:var(--red); }

  .chk-item { display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:13px; border:3px solid #E2E8F0; margin-bottom:10px; cursor:pointer; transition:all 0.2s; font-size:17px; font-weight:700; background:white; }
  .chk-item.checked { border-color:var(--green); background:#E8F5E9; }
  .chk-box { width:30px; height:30px; border-radius:8px; border:3px solid #CBD5E1; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; transition:all 0.2s; background:white; }
  .chk-item.checked .chk-box { background:var(--green); border-color:var(--green); color:white; }

  .sig-wrap { margin-top:18px; }
  .sig-lbl { font-size:13px; font-weight:800; margin-bottom:8px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .sig-cw { border:3px solid #E2E8F0; border-radius:14px; overflow:hidden; background:#FAFAFA; position:relative; }
  canvas { display:block; touch-action:none; }
  .sig-hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#CBD5E1; font-size:16px; font-weight:700; pointer-events:none; transition:opacity 0.3s; text-align:center; }
  .sig-clear { margin-top:8px; background:none; border:2px solid #E2E8F0; border-radius:10px; padding:7px 14px; font-family:inherit; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; }

  .finish-btn { width:100%; margin-top:20px; padding:18px; border:none; border-radius:16px; font-family:inherit; font-size:22px; font-weight:900; cursor:pointer; transition:transform 0.15s,opacity 0.2s; color:white; box-shadow:0 6px 18px rgba(0,0,0,0.15); }
  .finish-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .finish-btn:not(:disabled):active { transform:scale(0.97); }

  /* CELEBRATE */
  #celebrate { background:linear-gradient(160deg,#1B5E20 0%,#2E7D32 55%,#43A047 100%); align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .cel-icon { font-size:96px; animation:bounce 0.6s ease infinite alternate; }
  @keyframes bounce { from{transform:scale(1)} to{transform:scale(1.15)} }
  .cel-stars { font-size:34px; margin:10px 0; }
  .cel-title { font-size:44px; font-weight:900; color:var(--gold); margin-bottom:8px; text-shadow:0 4px 12px rgba(0,0,0,0.3); }
  .cel-name { font-size:26px; color:white; font-weight:900; margin-bottom:10px; }
  .cel-msg { font-size:19px; color:rgba(255,255,255,0.9); font-weight:600; margin-bottom:32px; line-height:1.6; white-space:pre-line; }
  .cel-btn { background:var(--gold); color:#1A1A1A; border:none; border-radius:16px; padding:16px 36px; font-family:inherit; font-size:22px; font-weight:900; cursor:pointer; box-shadow:0 6px 24px rgba(249,168,37,0.4); transition:transform 0.15s; }
  .cel-btn:active { transform:scale(0.96); }

  .toast { position:fixed; top:16px; right:16px; background:#1B5E20; color:white; padding:10px 18px; border-radius:12px; font-size:14px; font-weight:800; z-index:999; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div class="toast" id="toast">✅ Progress Saved!</div>

<!-- WORD POPUP (tap a word to see syllables + sound-it-out + hear it) -->
<div class="wpop" id="wpop">
  <div class="wpop-card" id="wpopCard">
    <div class="wpop-word" id="wpWord"></div>
    <div class="wpop-syl" id="wpSyl"></div>
    <div class="wpop-say" id="wpSay"></div>
    <div class="wpop-mean" id="wpMean"></div>
    <button class="wpop-spk" id="wpSpk">🔊 Hear it</button>
    <div class="wpop-close">tap anywhere to close</div>
  </div>
</div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-icon">🌟</div>
  <h1 class="home-title">Trent's Reading<br>Adventure</h1>
  <p class="home-sub">Book 10 • The Tree That Knew Everyone • 10 Days</p>
  <div class="home-card">
    <label class="name-label">What is your name?</label>
    <input class="name-input" id="nameInput" type="text" placeholder="Type your name..." maxlength="30" autocomplete="off">
  </div>
  <button class="start-btn" onclick="startApp()">Let's Go! 🌟</button>
  <a class="menu-link" href="index.html">🏠 Back to Menu</a>
</div>

<!-- MAP -->
<div id="map" class="screen">
  <div class="map-header">
    <div class="map-header-top">
      <div class="map-avatar">🌟</div>
      <div class="map-hd">
        <h2 id="mapName">Reading Adventure</h2>
        <p id="mapProg">0 of 10 days done</p>
      </div>
      <a class="home-btn" href="index.html" title="Menu">🏠</a>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="map-scroll">
    <div class="map-title">Choose Today's Story 🌳</div>
    <div id="dayList"></div>
  </div>
</div>

<!-- STORY -->
<div id="story" class="screen">
  <div class="story-hdr">
    <button class="back-btn" onclick="showMap()">←</button>
    <div class="shdr-info">
      <div class="s-day-tag" id="sDayTag"></div>
      <div class="s-title" id="sTitle"></div>
    </div>
    <div class="s-emoji" id="sEmoji"></div>
  </div>
  <div class="story-body" id="storyBody"></div>
</div>

<!-- CELEBRATE -->
<div id="celebrate" class="screen">
  <div class="cel-icon">🏆</div>
  <div class="cel-stars">⭐ ⭐ ⭐</div>
  <div class="cel-title">You Did It!</div>
  <div class="cel-name" id="celName"></div>
  <div class="cel-msg" id="celMsg"></div>
  <button class="cel-btn" onclick="showMap()">Back to My Days 🗺️</button>
</div>

<script>
const STORIES = [
  {"day":1,"title":"A Call Through the Roots","emoji":"📞","color":"#2E7D32","bg":"#E8F5E9","keyWords":["call","roots","Kai","Johnny","home"],"lines":["Kai woke before the sun.","He heard a call in his sleep.","It came up from the roots.","Kai ran to find Johnny.","Johnny had a hand on the roots.","\"I heard it, Kai,\" said Johnny.","\"It is a call from home.\"","\"It is the Old Tree.\"","The roots under the isle hummed.","A herd of deer ran by.","They ran toward the sea.","\"Even the deer feel the call.\"","Mae gave them a ship for home.","Finn and Kai packed fast.","\"Go home, Johnny,\" said Mae.","Johnny said, \"We will go home.\""],"quiz":{"q":"Who was calling Johnny home?","opts":["Mae","The Baron","The Old Tree","The whale"],"ans":2},"sameSound":[{"w":"heard","means":"took in a sound with ears","example":"I heard a loud bang."},{"w":"herd","means":"a group of deer or cows","example":"A herd of deer ran."}]},
  {"day":2,"title":"Home Again","emoji":"🏠","color":"#1565C0","bg":"#E3F2FD","keyWords":["ship","whale","storm","hill","town"],"lines":["The ship sailed fast and far.","The weather was fair at first.","Then a storm rose in the west.","\"We go, whether it storms or not.\"","The wind howled, and the ship rocked.","Then a huge shape rose up.","It was the whale!","The whale took the rope again.","It towed the ship through the storm.","The whale swam day and night.","The storm died at dawn.","\"Look, there is the hill,\" said Kai.","They saw the old hill and town.","The old tree stood on the hill.","The town glowed in the sun.","The whale sang as they neared town."],"quiz":{"q":"Who towed the ship home?","opts":["The whale","Mae","A bird","The Baron"],"ans":0},"sameSound":[{"w":"weather","means":"how hot or wet the air is","example":"The weather is fine."},{"w":"whether","means":"a word that says if or not","example":"I ask whether you can go."}]},
  {"day":3,"title":"The Old Tree Is Tired","emoji":"🍂","color":"#8D6E63","bg":"#EFEBE9","keyWords":["tree","leaves","old","tired","Johnny"],"lines":["Johnny ran up the hill.","The sole of his shoe flapped.","Johnny was tired from the run.","The old tree was still there.","But its leaves were brown.","Its bark was cracked, and leaves fell.","\"Old friend?\" said Johnny softly.","\"I am here, friend,\" said the tree.","Its voice was thin and slow.","\"I am old, Johnny, and tired.\"","\"I held this hill so many times.\"","The old tree had a kind soul.","Johnny sat down in the roots.","More leaves fell, soft and slow.","\"I am tired, not afraid.\"","\"I have one more gift to give.\""],"quiz":{"q":"What was wrong with the old tree?","opts":["It was lost","It was tired","It was angry","It was gone"],"ans":1},"sameSound":[{"w":"soul","means":"the kind heart inside you","example":"She has a kind soul."},{"w":"sole","means":"the bottom of your foot","example":"My sole got wet."}]},
  {"day":4,"title":"A Hundred Names","emoji":"📖","color":"#6A1B9A","bg":"#F3E5F5","keyWords":["names","kids","hundred","tree","Johnny"],"lines":["The old tree began to speak.","\"I know a hundred names.\"","\"Let me say some of them.\"","One by one, the kids came.","The tree said each name.","\"Sam, Max, and Ava,\" said the tree.","\"Tom, Lia, and Ben.\"","Kids came up the hill in line.","Each kid heard a name and smiled.","Johnny knew them all, too.","Johnny stood by the tree.","\"Why keep the names?\" asked Johnny.","\"A name means you are known.\"","\"A hundred names, a hundred friends.\"","\"The sum of the names is love.\"","The kids sang the names back."],"quiz":{"q":"What does the tree know?","opts":["The sea","A hundred names","The moon","A song"],"ans":1},"sameSound":[{"w":"some","means":"a part, but not all","example":"I ate some bread."},{"w":"sum","means":"the whole when you add up","example":"The sum of two and two."}]},
  {"day":5,"title":"The Long Climb","emoji":"⛰️","color":"#E65100","bg":"#FFF3E0","keyWords":["climb","wind","seeds","branch","Kai"],"lines":["\"Shake my seeds loose,\" said the tree.","\"The wind will carry them far.\"","Kai began to climb the tree.","It was a long, hard climb.","His feet were sore from the climb.","He climbed to the top branch.","Seeds hung from every branch.","Kai shook the branch hard.","Down came a rain of seeds.","The wind caught them.","Seeds began to soar.","They soared over the town.","The wind lifted them over the sea.","Each seed would find new ground.","Kai slid down, sore but glad.","\"Go well, little seeds,\" said the tree."],"quiz":{"q":"Who climbed the old tree?","opts":["Finn","Mae","Kai","The Baron"],"ans":2},"sameSound":[{"w":"soar","means":"to fly high in the air","example":"Birds soar over us."},{"w":"sore","means":"hurt and tender to touch","example":"My foot is sore."}]},

  {"day":9,"title":"The Last Seed","emoji":"🌰","color":"#5D4037","bg":"#EFEBE9","keyWords":["seed","tree","Johnny","hand","story"],"lines":["The old tree gave a last shiver.","One gold seed fell down.","Johnny caught it in his hand.","\"This is the seed of seeds.\"","\"It holds all my names.\"","\"It holds the town and the sea.\"","\"It knew you before you knew it.\"","\"A new tree will grow from it.\"","\"Who will plant it?\" asked Johnny.","\"The one who tells the story.\"","\"A story needs a hand.\"","Johnny looked far past the hill.","He knew who it was.","\"Trent,\" said Johnny, \"tells the story.\"","The tree smiled, and its leaves glowed.","Johnny closed his hand round the seed."],"quiz":{"q":"What did the old tree give Johnny?","opts":["A map","A gold seed","A stone","A bell"],"ans":1},"sameSound":[{"w":"new","means":"not old, just made","example":"I got a new hat."},{"w":"knew","means":"had it in your head","example":"I knew the way."}]},

  "right":["right","RYT"], "road":["road","ROHD"], "roof":["roof","ROOF"],
  "roots":["roots","ROOTS"], "round":["round","ROWND"], "sad":["sad","SAD"],
  "safe":["safe","SAYF"], "said":["said","SED"], "sat":["sat","SAT"],
  "saw":["saw","SAW"], "say":["say","SAY"], "says":["says","SEZ"],
  "scared":["scared","SKAIRD"], "school":["school","SKOOL"], "sea":["sea","SEE"],
  "seed":["seed","SEED"], "seeds":["seeds","SEEDZ"], "sent":["sent","SENT"],
  "set":["set","SET"], "shade":["shade","SHAYD"], "share":["share","SHAIR"],
  "sheriff":["sher · iff","SHAIR-if"], "shook":["shook","SHUUK"], "shoot":["shoot","SHOOT"],
  "shop":["shop","SHOP"], "shops":["shops","SHOPS"], "shut":["shut","SHUT"],
  "side":["side","SYD"], "single":["sin · gle","SING-guhl"], "sit":["sit","SIT"],
  "sleep":["sleep","SLEEP"], "slow":["slow","SLOH"], "small":["small","SMAWL"],
  "smart":["smart","SMART"], "smile":["smile","SMYL"], "smiled":["smiled","SMYLD"],
  "so":["so","SOH"], "soft":["soft","SOFT"], "soil":["soil","SOYL"],
  "some":["some","SUM"], "sorry":["sor · ry","SOR-ee"], "sound":["sound","SOWND"],
  "spot":["spot","SPOT"], "stars":["stars","STARZ"], "start":["start","START"],
  "started":["start · ed","STAR-tid"], "starts":["starts","STARTS"], "step":["step","STEP"],
  "still":["still","STIL"], "stone":["stone","STOHN"], "stood":["stood","STUUD"],
  "stop":["stop","STOP"], "store":["store","STOR"], "stories":["sto · ries","STOR-eez"],
  "story":["sto · ry","STOR-ee"], "strange":["strange","STRAYNJ"], "street":["street","STREET"],
  "strong":["strong","STRAWNG"], "sun":["sun","SUN"], "supper":["sup · per","SUP-ur"],
  "sweet":["sweet","SWEET"], "take":["take","TAYK"], "talk":["talk","TAWK"],
  "tall":["tall","TAWL"], "taller":["tall · er","TAW-lur"], "teach":["teach","TEECH"],
  "tell":["tell","TEL"], "ten":["ten","TEN"], "thank":["thank","THANK"],
  "that":["that","THAT"], "the":["the","THUH"], "their":["their","THAIR"],
  "them":["them","THEM"], "then":["then","THEN"], "there":["there","THAIR"],
  "they":["they","THAY"], "thing":["thing","THING"], "things":["things","THINGZ"],
  "think":["think","THINGK"], "this":["this","THIS"], "three":["three","THREE"],
  "through":["through","THROO"], "time":["time","TYM"], "times":["times","TYMZ"],
  "tired":["tired","TYRD"], "to":["to","TOO"], "told":["told","TOHLD"],
  "tomorrow":["to · mor · row","tuh-MOR-oh"], "too":["too","TOO"], "took":["took","TUUK"],
  "town":["town","TOWN"], "tree":["tree","TREE"], "trees":["trees","TREEZ"],
  "trent":["Trent","TRENT"], "true":["true","TROO"], "truth":["truth","TROOTH"],
  "twist":["twist","TWIST"], "two":["two","TOO"], "under":["un · der","UN-dur"],
  "up":["up","UP"], "us":["us","US"], "very":["ver · y","VAIR-ee"],
  "wait":["wait","WAYT"], "walk":["walk","WAWK"], "walked":["walked","WAWKT"],
  "wall":["wall","WAWL"], "want":["want","WONT"], "wanted":["want · ed","WON-tid"],
  "wants":["wants","WONTS"], "warm":["warm","WARM"], "was":["was","WUZ"],
  "watch":["watch","WOCH"], "water":["wa · ter","WAW-tur"], "wave":["wave","WAYV"],
  "way":["way","WAY"], "well":["well","WEL"], "went":["went","WENT"],
  "were":["were","WUR"], "what":["what","WUT"], "when":["when","WEN"],
  "where":["where","WAIR"], "who":["who","HOO"], "whole":["whole","HOHL"],
  "why":["why","WY"], "wide":["wide","WYD"], "wild":["wild","WYLD"],
  "wind":["wind","WIND"], "wish":["wish","WISH"], "with":["with","WITH"],
  "woke":["woke","WOHK"], "won":["won","WUN"], "woods":["woods","WUUDZ"],
  "work":["work","WURK"], "world":["world","WURLD"], "would":["would","WUUD"],
  "wrong":["wrong","RAWNG"], "wrote":["wrote","ROHT"], "yard":["yard","YARD"],
  "years":["years","YEERZ"], "yell":["yell","YEL"], "yes":["yes","YES"],
  "yet":["yet","YET"], "you":["you","YOO"], "your":["your","YOR"],
  "yours":["yours","YORZ"]
};

let userName="", completed=[], currentDay=null;
let sigCanvas, sigCtx, drawing=false, hasSig=false;
let checks=[false,false,false], quizDone=false, wwDone=false, wwToken=0;
const KEY='trent_reading_names_v1';

/* ---------- SPEECH (phone's built-in voice, Web Speech API) ---------- */
let ttsVoice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  ttsVoice = vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || vs[0] || null;
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }
function speak(text){
  if(!('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.85; u.pitch=1; u.lang='en-US';
    if(ttsVoice) u.voice=ttsVoice;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ---------- WORD POPUP ---------- */
function fallbackSyl(w){
  const m = w.toLowerCase().match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy](?=[^aeiouy]))?|[^aeiouy]+$/gi);
  return (m && m.length) ? m.join(' · ') : w;
}
function soundInfo(w){
  const s=STORIES[currentDay];
  return ((s&&s.sameSound)||[]).find(x=>x.w.toLowerCase()===w.toLowerCase())||null;
}
function openWord(el){
  const raw = el.getAttribute('data-w');
  const p = PRON[raw.toLowerCase()];
  document.getElementById('wpWord').textContent = raw;
  document.getElementById('wpSyl').textContent = p ? p[0] : fallbackSyl(raw);
  const sayEl=document.getElementById('wpSay');
  if(p && p[1]){ sayEl.textContent='“'+p[1]+'”'; sayEl.style.display=''; }
  else { sayEl.style.display='none'; }
  const meanEl=document.getElementById('wpMean');
  const sa = el.classList.contains('sa') ? soundInfo(raw) : null;
  if(sa){ meanEl.textContent=sa.w.toLowerCase()+' = '+sa.means; meanEl.style.display='block'; }
  else { meanEl.style.display='none'; }
  document.getElementById('wpSpk').onclick=(e)=>{ e.stopPropagation(); speak(raw); };
  document.getElementById('wpop').classList.add('show');
  // no auto-play — Trent taps "🔊 Hear it" when he wants to hear it
}
function closeWord(){ document.getElementById('wpop').classList.remove('show'); }

function saveProgress() {
  try { localStorage.setItem(KEY, JSON.stringify({name:userName, completed})); showToast(); } catch(e){}
}
function loadProgress(name) {
  try {
    const d=JSON.parse(localStorage.getItem(KEY)||'{}');
    if (d.name && d.name.toLowerCase()===name.toLowerCase()) return d.completed||[];
  } catch(e){}
  return [];
}
function showToast() {
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function startApp() {
  const n=document.getElementById('nameInput').value.trim();
  if(!n){document.getElementById('nameInput').focus();return;}
  userName=n; completed=loadProgress(n); showMap();
}
function showMap() {
  show('map');
  document.getElementById('mapName').textContent=userName+"'s Adventure";
  const done=completed.length;
  document.getElementById('mapProg').textContent=done+" of 10 days done";
  document.getElementById('progFill').style.width=(done*10)+"%";
  const list=document.getElementById('dayList'); list.innerHTML='';
  STORIES.forEach((s,i)=>{
    const isDone=completed.includes(i);
    const isCur=!isDone&&(i===0||completed.includes(i-1));
    const isLocked=!isDone&&!isCur;
    const c=document.createElement('div');
    c.className='day-card'+(isDone?' done':'')+(isCur?' current':'')+(isLocked?' locked':'');
    c.innerHTML=`<div class="day-num" style="background:${s.color}">${s.day}</div><div class="day-info"><h3>${s.title}</h3><p>Day ${s.day}</p></div><div class="day-emoji">${s.emoji}</div>`;
    if(!isLocked) c.onclick=()=>openStory(i);
    list.appendChild(c);
  });
}
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderLine(line,kws,sas) {
  const kset=new Set(kws.map(k=>k.toLowerCase()));
  const aset=new Set((sas||[]).map(k=>k.toLowerCase()));
  return line.split(/([A-Za-z]+)/).map(tok=>{
    if(/^[A-Za-z]+$/.test(tok)){
      const cls='word'+(kset.has(tok.toLowerCase())?' hl':'')+(aset.has(tok.toLowerCase())?' sa':'');
      return `<span class="${cls}" data-w="${tok}" onclick="openWord(this)">${tok}</span>`;
    }
    return esc(tok);
  }).join('');
}
function openStory(idx) {
  currentDay=idx; checks=[false,false,false]; quizDone=false; hasSig=false; wwDone=false; wwToken++;
  const s=STORIES[idx];
  document.getElementById('sDayTag').textContent='DAY '+s.day;
  document.getElementById('sDayTag').style.color=s.color;
  document.getElementById('sTitle').textContent=s.title;
  document.getElementById('sEmoji').textContent=s.emoji;
  const body=document.getElementById('storyBody'); body.innerHTML='';
  if(!s.sameSound||!s.sameSound.length){ wwDone=true; startReading(idx); return; }

  // before the story: "Same sound, different meaning" card
  const card=document.createElement('div');
  card.innerHTML=`<div class="sa-hd" style="color:${s.color}">Same sound, different meaning 🔵</div>`
    +(idx===0?`<div class="sa-intro">These words sound the same. They mean different things.</div>`:`<div class="sa-intro">Meet today's sound-alike words.</div>`)
    +s.sameSound.map(x=>`<div class="sa-word"><div class="sa-top"><div class="sa-big">${esc(x.w)}</div><button class="sa-spk" data-w="${esc(x.w)}" onclick="speak(this.dataset.w)">🔊 Hear it</button></div><div class="sa-means">${renderLine(x.means,[])}</div><div class="sa-ex">${renderLine(x.example,[])}</div></div>`).join('')
    +`<button class="finish-btn" style="background:${s.color}" onclick="startReading(${idx})">Got it, let's read ➜</button>`;
  body.appendChild(card);
  show('story');
}
function startReading(idx) {
  const s=STORIES[idx];
  const body=document.getElementById('storyBody'); body.innerHTML='';

  // key words
  const kb=document.createElement('div'); kb.className='kw-box';
  kb.style.cssText=`border-color:${s.color};background:${s.bg}`;
  kb.innerHTML=`<div class="kw-lbl">Look for these words 👀</div><div class="kw-list">${s.keyWords.map(w=>`<span class="kw-chip" style="background:${s.color}">${w}</span>`).join('')}</div>`;
  body.appendChild(kb);

  // tap tip
  const tip=document.createElement('div'); tip.className='tap-tip';
  tip.textContent='👆 Tap any hard word to see it and sound it out.';
  body.appendChild(tip);
  if(s.sameSound&&s.sameSound.length){
    const stip=document.createElement('div'); stip.className='sa-tip';
    stip.textContent='🔵 A blue line marks a sound-alike word. Tap it!';
    body.appendChild(stip);
  }

  // lines (tappable words only — no whole-line audio; Trent reads it himself)
  s.lines.forEach(line=>{
    const row=document.createElement('div'); row.className='s-line';
    row.innerHTML=renderLine(line,s.keyWords,(s.sameSound||[]).map(x=>x.w));
    body.appendChild(row);
  });

  // after the story, before the quiz: "Which is which?"
  if(s.sameSound&&s.sameSound.length){
    const wd=document.createElement('div'); wd.className='sec';
    wd.innerHTML=`<div class="sec-title" style="color:${s.color}">Which is which? 🔵</div><div class="sec-sub">Tap the word that fits.</div><div id="wwBox"></div>`;
    body.appendChild(wd);
    renderWW(0);
  }

  // quiz
  const qd=document.createElement('div'); qd.className='sec';
  qd.innerHTML=`<div class="sec-title" style="color:${s.color}">Quick Check ✏️</div><div class="sec-sub">Tap the right answer</div><div class="quiz-q">${s.quiz.q}</div><div class="quiz-opts" id="qOpts">${s.quiz.opts.map((o,i)=>`<button class="qopt" onclick="answerQuiz(${i},${s.quiz.ans})">${o}</button>`).join('')}</div><div class="quiz-fb" id="qFb"></div>`;
  body.appendChild(qd);

  // signoff
  const sd=document.createElement('div'); sd.className='sec';
  sd.innerHTML=`<div class="sec-title" style="color:${s.color}">Sign Off ✍️</div><div style="height:6px"></div>${['I read every word','I found the key words','I am proud of myself'].map((l,i)=>`<div class="chk-item" id="chk${i}" onclick="toggleChk(${i})"><div class="chk-box" id="box${i}"></div><span>${l}</span></div>`).join('')}<div class="sig-wrap"><div class="sig-lbl">Sign your name</div><div class="sig-cw"><canvas id="sigCanvas" height="130"></canvas><div class="sig-hint" id="sigHint">✍️ Draw your name here</div></div><button class="sig-clear" onclick="clearSig()">Clear ✕</button></div><button class="finish-btn" id="finBtn" style="background:${s.color}" onclick="finishDay()" disabled>Done for Today! 🎉</button>`;
  body.appendChild(sd);

  show('story'); setupCanvas();
}
function shuffle(a){
  const b=a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function renderWW(step) {
  const box=document.getElementById('wwBox'); if(!box) return;
  const set=STORIES[currentDay].sameSound;
  if(step>=set.length){
    wwDone=true;
    box.innerHTML='<div class="ww-done">✅ You got them all!</div>';
    checkReady(); return;
  }
  box.innerHTML=`<div class="ww-count">Word ${step+1} of ${set.length}</div><div class="ww-q">${renderLine(set[step].means,[])}</div><div class="ww-opts">${shuffle(set).map(o=>`<button class="ww-btn" data-w="${esc(o.w)}">${esc(o.w)}</button>`).join('')}</div><div class="quiz-fb" id="wwFb"></div>`;
  box.querySelectorAll('.ww-btn').forEach(b=>{ b.onclick=()=>pickWW(step,b); });
}
function pickWW(step,btn) {
  if(btn.disabled) return;
  const set=STORIES[currentDay].sameSound;
  const want=set[step], got=set.find(x=>x.w===btn.getAttribute('data-w'));
  const fb=document.getElementById('wwFb');
  if(got.w===want.w){
    document.querySelectorAll('.ww-btn').forEach(b=>{ b.disabled=true; });
    btn.classList.add('correct'); btn.textContent='✓ '+got.w;
    fb.textContent='✓ Yes! That is right!'; fb.className='quiz-fb good';
    const tok=wwToken;
    setTimeout(()=>{ if(tok===wwToken) renderWW(step+1); },1100);
  } else {
    btn.disabled=true; btn.classList.add('wrong');
    fb.textContent='Not yet. '+got.w+' = '+got.means+'. Try again!'; fb.className='quiz-fb bad';
  }
}
function answerQuiz(chosen,correct) {
  if(quizDone) return; quizDone=true;
  document.querySelectorAll('.qopt').forEach((o,i)=>{ o.classList.add('disabled'); if(i===correct) o.classList.add('correct'); else if(i===chosen) o.classList.add('wrong'); });
  const fb=document.getElementById('qFb');
  if(chosen===correct){fb.textContent='✅ Yes! That is right!';fb.className='quiz-fb good';}
  else{fb.textContent='❌ Not quite — the green one is right.';fb.className='quiz-fb bad';}
  checkReady();
}
function toggleChk(i) {
  checks[i]=!checks[i];
  document.getElementById('chk'+i).classList.toggle('checked',checks[i]);
  document.getElementById('box'+i).textContent=checks[i]?'✓':'';
  checkReady();
}
function checkReady() { document.getElementById('finBtn').disabled=!(checks.every(Boolean)&&hasSig&&quizDone&&wwDone); }
function setupCanvas() {
  sigCanvas=document.getElementById('sigCanvas');
  sigCanvas.width=sigCanvas.parentElement.clientWidth||340;
  sigCtx=sigCanvas.getContext('2d');
  sigCtx.strokeStyle='#1A1A1A'; sigCtx.lineWidth=4; sigCtx.lineCap='round'; sigCtx.lineJoin='round';
  function pos(e){const r=sigCanvas.getBoundingClientRect(),src=e.touches?e.touches[0]:e;return{x:src.clientX-r.left,y:src.clientY-r.top};}
  sigCanvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);});
  sigCanvas.addEventListener('mousemove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();hasSig=true;document.getElementById('sigHint').style.opacity='0';checkReady();});
  sigCanvas.addEventListener('mouseup',()=>drawing=false);
  sigCanvas.addEventListener('touchstart',e=>{drawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);},{passive:false});
  sigCanvas.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();hasSig=true;document.getElementById('sigHint').style.opacity='0';checkReady();},{passive:false});
  sigCanvas.addEventListener('touchend',()=>drawing=false);
}
function clearSig(){sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hasSig=false;document.getElementById('sigHint').style.opacity='1';checkReady();}
function finishDay() {
  if(!completed.includes(currentDay)) completed.push(currentDay);
  saveProgress();
  const s=STORIES[currentDay];
  document.getElementById('celName').textContent=userName+'!';
  const msgs=["You finished Day "+s.day+".\nYou are doing great!","Day "+s.day+" is done.\nYou are getting stronger every day!","Another story done, "+userName+".\nKeep it up — you are on a roll!"];
  document.getElementById('celMsg').textContent=msgs[currentDay%msgs.length];
  show('celebrate');
}
window.onload=()=>{
  try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d.name)document.getElementById('nameInput').value=d.name;}catch(e){}
  // close the word popup when tapping anywhere on the overlay (incl. the card)
  const wp=document.getElementById('wpop');
  if(wp) wp.addEventListener('click', closeWord);
};
</script>
