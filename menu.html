<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trent's Adventure</title>
<style>
  :root { --gold:#F9A825; --green:#388E3C; --blue:#1565C0; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
         background:linear-gradient(160deg,#0D3B1E 0%,#14532D 45%,#0D47A1 100%);
         min-height:100vh; color:white; display:flex; flex-direction:column;
         align-items:center; justify-content:center; padding:36px 22px; text-align:center; }
  .hi { font-size:64px; margin-bottom:6px; animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  h1 { font-size:36px; font-weight:900; line-height:1.15; margin-bottom:6px; text-shadow:0 4px 12px rgba(0,0,0,0.35); }
  .sub { font-size:18px; font-weight:700; color:rgba(255,255,255,0.85); margin-bottom:34px; }

  .cards { display:flex; flex-direction:column; gap:18px; width:100%; max-width:400px; }
  .pick { display:block; text-decoration:none; color:#1A1A1A; background:white; border-radius:24px;
          padding:24px 22px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:5px solid transparent;
          transition:transform 0.15s; text-align:left; }
  .pick:active { transform:scale(0.97); }
  .pick.reading { border-color:var(--green); }
  .pick.math { border-color:var(--blue); }
  .pick-top { display:flex; align-items:center; gap:16px; }
  .pick-emoji { font-size:52px; flex-shrink:0; }
  .pick-t { flex:1; }
  .pick-t h2 { font-size:28px; font-weight:900; line-height:1.1; }
  .pick-t p { font-size:15px; font-weight:700; color:#6B7280; margin-top:3px; }
  .pick-go { font-size:30px; font-weight:900; color:#CBD5E1; }

  .bar-wrap { margin-top:16px; }
  .bar-lbl { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:#6B7280; margin-bottom:6px; }
  .bar { background:#E2E8F0; border-radius:20px; height:12px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:20px; transition:width 0.6s ease; }
  .pick.reading .bar-fill { background:var(--green); }
  .pick.math .bar-fill { background:var(--blue); }
  .done-tag { color:var(--gold); }

  .foot { margin-top:32px; font-size:15px; font-weight:700; color:rgba(255,255,255,0.75); line-height:1.6; }
</style>
</head>
<body>

  <div class="hi" id="hi">🌟</div>
  <h1 id="title">Trent's Adventure</h1>
  <p class="sub">Pick what you want to do today</p>

  <div class="cards">
    <a class="pick reading" id="readCard" href="series3-johnny-plants-the-world.html">
      <div class="pick-top">
        <div class="pick-emoji">📖</div>
        <div class="pick-t">
          <h2>Reading</h2>
          <p id="readSub">Johnny Plants the World • 10 Days</p>
        </div>
        <div class="pick-go">➜</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-lbl"><span id="readProg">0 of 10 days done</span><span id="readDone"></span></div>
        <div class="bar"><div class="bar-fill" id="readFill" style="width:0%"></div></div>
      </div>
    </a>

    <a class="pick math" id="mathCard" href="math.html">
      <div class="pick-top">
        <div class="pick-emoji">➕</div>
        <div class="pick-t">
          <h2>Math</h2>
          <p id="mathSub">Add &amp; Take Away • 10 Days</p>
        </div>
        <div class="pick-go">➜</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-lbl"><span id="mathProg">0 of 10 days done</span><span id="mathDone"></span></div>
        <div class="bar"><div class="bar-fill" id="mathFill" style="width:0%"></div></div>
      </div>
    </a>
  </div>

  <div class="foot">Do one a day.<br>You do not have to do both. 👊</div>

<script>
/* ---------------------------------------------------------------------------
   THE MENU — this is what Trent lands on from the texted link.
   Pick Reading or Math, then he sees that app's 10 days.

   To point Reading at a different series later, change these two lines
   (the file it opens + the save key it reads progress from):
--------------------------------------------------------------------------- */
const READING_FILE = 'series3-johnny-plants-the-world.html';
const READING_KEY  = 'trent_reading_world_v1';   // must match KEY in that file
const READING_NAME = 'Johnny Plants the World • 10 Days';
const MATH_KEY     = 'trent_math_v1';            // must match KEY in math.html

function daysDone(key){
  try {
    const d = JSON.parse(localStorage.getItem(key) || '{}');
    return Array.isArray(d.completed) ? d.completed.length : 0;
  } catch(e){ return 0; }
}
function savedName(){
  for (const k of [READING_KEY, MATH_KEY]) {
    try {
      const d = JSON.parse(localStorage.getItem(k) || '{}');
      if (d.name) return d.name;
    } catch(e){}
  }
  return '';
}
function paint(prefix, key){
  const n = daysDone(key);
  document.getElementById(prefix+'Prog').textContent = n + ' of 10 days done';
  document.getElementById(prefix+'Fill').style.width = (n*10) + '%';
  document.getElementById(prefix+'Done').innerHTML = n >= 10 ? '<span class="done-tag">★ ALL DONE</span>' : '';
}
window.onload = () => {
  document.getElementById('readCard').href = READING_FILE;
  document.getElementById('readSub').textContent = READING_NAME;
  const name = savedName();
  if (name) document.getElementById('title').textContent = name + "'s Adventure";
  paint('read', READING_KEY);
  paint('math', MATH_KEY);
};
</script>
</body>
</html>
